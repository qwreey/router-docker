# router's own front door - see router/.claude/router-nginx-hardening-plan.md
# for why this exists. router now terminates host:80 directly (Docker's own
# `ports: - "80:80"` publish on the code-docker-router service, no longer a
# netgate DNAT pass-through - the netgate `forwards:` entry for host_port 80
# was removed since this local listener intercepts before DNAT ever would).
#
# Routing: /exports/ (Dev Proxy end-user traffic) and /router/ (router-manager's
# own setup UI + API) are handled here, both over unix sockets hardcoded
# directly in their location blocks below (no envsubst needed - there's
# exactly one correct path for each, same "fixed layout" reasoning
# devproxy.go's own constants use) - router-manager binds
# /run/router-manager.sock, caddy-adapter binds /run/caddy-adapter.sock.
# Everything else falls through to code-docker:80 unchanged - code-docker's
# own nginx still does the /manager/ vs / split exactly as before, this
# layer doesn't need to know about that.
#
# nginx-service.default.sh envsubst's every ${NGINX_*} placeholder below
# into a runtime copy, same idiom as the main image's config/nginx.default.conf.

# `user root` - Arch's nginx package defaults worker processes to a
# non-root user when this directive is omitted, which can't reach
# router-manager's/caddy-adapter's unix sockets (0o660, owned by root -
# confirmed live: omitting this produced "Permission denied" connecting to
# /run/router-manager.sock). Every other supervisord program in this
# container already runs as root (supervisord itself is invoked with
# --user root), so this just matches that existing trust model instead of
# introducing worker-level privilege separation that isn't providing real
# isolation here anyway.
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    access_log /dev/stdout combined${NGINX_ACCESS_LOG_IF};

    # router is now the actual internet-facing hop (unlike code-docker's own
    # nginx, whose only peer is router itself) - TRUSTED_PROXIES here is for
    # your own outer reverse proxy, same meaning/env var as the main image's
    # copy of this setting.
    ${NGINX_TRUSTED_PROXIES_DIRECTIVES}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # tailscaled runs on router now (moved from code-docker) - same
    # auto-loopback-forwarding concern as the main image's nginx, just
    # relevant here instead since this is the container that actually has a
    # tailscale identity. See config/nginx.default.conf's own copy of this
    # map for the full explanation.
    map $server_addr $code_docker_loopback_blocked {
        ${NGINX_LOOPBACK_BLOCK_MAP}
    }

    map $host $code_docker_host_allowed {
        ${NGINX_ALLOWED_HOSTS_MAP}
    }

    # The scheme the *browser* used, for the hops below that need to build a
    # URL the browser will be sent back to - today that's tinyauth, which
    # composes its post-login redirect_uri out of X-Forwarded-Proto. router
    # itself always terminates plain HTTP (TLS is your own outer reverse
    # proxy's job), so $scheme here is permanently "http" and can only be
    # the right answer when nothing is in front of router at all; whatever
    # the outer proxy sent is authoritative otherwise. Falling back to
    # $scheme rather than leaving it empty matters: tinyauth answers 400 Bad
    # Request, not 401, when X-Forwarded-Proto is missing - see
    # backend/internal/devproxy/forwardauth.go.
    map $http_x_forwarded_proto $router_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # The canonical nginx WebSocket-upgrade map. Used by the /router/
    # locations below, which carry the VNC tab's RFB bridge alongside
    # ordinary JSON API calls - a hardcoded `Connection "upgrade"` (what the
    # /exports/, /app/ and catch-all locations use, since everything through
    # those is proxied traffic that may want an upgrade) would send it on
    # every XHR too. There's no upstream keepalive configured for any of
    # these, so the "close" branch costs nothing.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ALLOWED_EXPORT_HOSTS (see docs/dev-proxy.md) - moved here from
    # code-docker's nginx along with the /exports/ location itself.
    map $host $code_docker_export_host_allowed {
        ${NGINX_ALLOWED_EXPORT_HOSTS_MAP}
    }

    # Strips router-manager's own admin unlock cookie (see
    # router/backend/internal/authgate.CookieName) out of whatever Cookie
    # header a request carries, before that header ever reaches an
    # attacker-influenced proxy target (/exports/ and /app/ below). Necessary
    # because docs/dev-proxy.md's and docs/app-routes.md's default setups
    # both deliberately reuse the same hostname for code-server/webmanager/
    # router-admin AND every /exports/ or /app/ target (that's the whole
    # point of the prefix trick) - so the browser genuinely does attach this
    # host-only cookie to /exports/ and /app/ requests too. Without this, a
    # malicious or merely careless proxied target could read a live admin
    # session token straight out of the forwarded Cookie header and replay
    # it against /router/api/... later.
    #
    # This only closes the "untrusted backend reads the raw header"
    # vector - it does NOT stop client-side script running same-origin
    # (e.g. an XSS in webmanager/code-server itself, or a compromised agent
    # writing to the page) from issuing its own same-origin
    # fetch('/router/api/...'), since the browser attaches this cookie to
    # that request directly through the /router/ location below, which never
    # strips it (nor should it - that's the legitimate destination). See
    # docs/router.md's "router-manager 자체 인증" security note - closing
    # that gap needs ROUTER_MANAGER_HOSTS (below) so router-manager's cookie
    # is scoped to a dedicated origin instead of the shared one at all.
    #
    # Best-effort on exact cookie-string formatting (may leave a stray
    # "; ;" where the cookie used to sit) - the only property that actually
    # matters is that the token value itself never reaches the target.
    #
    # Chained 3x rather than a single map: PCRE's greedy (?<a>.*) only
    # backtracks as far as the LAST "router_manager_unlock=" match in the
    # header, so a single pass leaves any earlier occurrence untouched. A
    # same-origin script (the exact XSS-adjacent threat this strip defends
    # against, see above) can set a second same-named cookie at a different
    # Path (e.g. Path=/exports) - the browser then sends both, and a
    # single-pass map would forward the first one straight through to
    # /exports/ or /app/. Each pass below removes one more occurrence (the
    # new last one) by feeding the previous pass's output back in as
    # $http_cookie was originally; nginx `map` can't loop or substitute
    # globally in one regex, so this is bounded to 3 duplicates rather than
    # truly unlimited - more than enough for any accidental case, and an
    # attacker who can already set arbitrarily many same-origin cookies has
    # bigger problems than this specific header.
    map $http_cookie $router_manager_cookie_stripped_pass1 {
        default $http_cookie;
        "~*(?<a>.*)router_manager_unlock=[^;]*(?<b>.*)" "$a$b";
    }
    map $router_manager_cookie_stripped_pass1 $router_manager_cookie_stripped_pass2 {
        default $router_manager_cookie_stripped_pass1;
        "~*(?<a>.*)router_manager_unlock=[^;]*(?<b>.*)" "$a$b";
    }
    map $router_manager_cookie_stripped_pass2 $router_manager_cookie_stripped {
        default $router_manager_cookie_stripped_pass2;
        "~*(?<a>.*)router_manager_unlock=[^;]*(?<b>.*)" "$a$b";
    }

    # ROUTER_MANAGER_HOSTS (router/example-env.router, comma-separated,
    # default empty) - dedicated hostname(s) (e.g. router.code.yaeji.moe)
    # that serve router-manager's SPA+API standalone, at their own origin,
    # instead of the shared /router/ path on the main hostname. Not a
    # security *filter* on top of the main site - it's a completely separate
    # nginx server{} block, selected by nginx's own server_name matching, so
    # when unset this whole block is simply absent (envsubst substitutes
    # empty text below, see nginx-service.default.sh) and nothing changes
    # from before. Static/env-only by design, same as ALLOWED_HOSTS/
    # ALLOWED_EXPORT_HOSTS/ROUTER_NGINX_DENY_INTERNAL_EXPORTS above - this is
    # the actual security boundary (which Host headers even reach
    # router-manager as a dedicated origin), so it isn't made in-app
    # editable the way the admin password is; router-manager's own Settings
    # tab shows the currently-configured value read-only instead (see
    # handleAuthStatus). See docs/router.md for the full rationale: a
    # request that lands here gets a router_manager_unlock cookie scoped
    # only to *this* host, so a compromise anywhere on the shared
    # code-server/webmanager/exports/app origin can no longer ride an
    # ambient same-origin cookie into router-manager, the way it still can
    # via the shared-origin /router/ path above.
    ${NGINX_ROUTER_MANAGER_SERVER_BLOCK}

    # TINYAUTH_HOSTS (router/example-env.router, comma-separated, default
    # empty) - dedicated hostname(s) serving tinyauth's own login UI, the
    # page a Dev Proxy route / App Route / VNC target with "인증 요구" sends
    # an unauthenticated browser to. Same static, envsubst'd,
    # absent-when-unset shape as the router-manager block above.
    #
    # It has to be a hostname of its own rather than a path on the shared
    # one: tinyauth's SPA references its assets and its own API by
    # root-absolute path (/assets/..., /api/user/login, /favicon.svg, ...)
    # and has no base-path setting - passing a path in TINYAUTH_APPURL is
    # accepted but ignored, verified against v5.1.3, so anything but the
    # root of an origin it owns serves a blank page. Before this block
    # existed, nothing in router routed to tinyauth's port at all, so its
    # login page was simply unreachable and "인증 요구" could not be
    # completed by anyone.
    #
    # Sharing the login session across the *protected* hostnames is
    # tinyauth's own doing, not something this block arranges: it sets its
    # session cookie on the parent domain (auth.subdomainsenabled, on by
    # default), so auth.example.com's login covers code.example.com too.
    # Pick a hostname under the same parent domain as the sites you're
    # protecting.
    ${NGINX_TINYAUTH_SERVER_BLOCK}

    # ROUTER_VHOST_<NAME> (one env var per entry, "<host>[,<host>...]=<upstream>",
    # see nginx-service.default.sh's own comment) - server{} blocks that give a
    # side project's container a whole hostname of its own, generated with the
    # same static, envsubst'd, absent-when-unset shape as the two blocks above.
    #
    # This is the "attach a normal web app at its own origin" path, as opposed
    # to App Routes (/app/<name>/ on the shared hostname) and Dev Proxy
    # (/exports/ + Host matching inside caddy-adapter). Reach for it when the
    # app must own an origin - either because it can't live under a path
    # prefix, or because sharing an origin with code-server/webmanager would
    # hand whatever runs in that app the same-origin reach into webmanager's
    # own API that the shared hostname implies.
    ${NGINX_VHOST_SERVER_BLOCKS}

    server {
        listen 80 default_server;

        if ($code_docker_loopback_blocked) {
            return 403 "blocked: reached via tailscale's automatic loopback forwarding, not the published port - see NGINX_BLOCK_LOOPBACK in example-env\n";
        }
        if ($code_docker_host_allowed = 0) {
            return 403 "Host not allowed - see ALLOWED_HOSTS in example-env\n";
        }

        client_max_body_size 0;
        proxy_read_timeout 3600s;

        # Dev Proxy end-user traffic - router's own Caddy (caddy-adapter),
        # over a unix socket (see caddy-adapter.default.sh, Phase 4 of the
        # hardening plan). code-docker-internal source is denied by default
        # here (ROUTER_NGINX_DENY_INTERNAL_EXPORTS, default on) - genuine
        # external Dev Proxy consumers arrive over code-docker-external (or
        # via your own outer reverse proxy in front of that), code-docker
        # itself has no legitimate reason to reach this location directly.
        location /exports/ {
            ${NGINX_DENY_INTERNAL_EXPORTS_DIRECTIVE}
            if ($code_docker_export_host_allowed = 0) {
                return 403 "Host not allowed - see ALLOWED_EXPORT_HOSTS in example-env\n";
            }
            rewrite ^/exports/(.*)$ /$1 break;
            proxy_pass http://unix:/run/caddy-adapter.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # tinyauth's forward_auth needs this to build a post-login
            # redirect back to the browser's own scheme - see the
            # $router_forwarded_proto map above.
            proxy_set_header X-Forwarded-Proto $router_forwarded_proto;
            proxy_set_header Cookie $router_manager_cookie_stripped;
        }

        # router-manager's own standalone SPA + API (App Routes/Dev
        # Proxy/Tailscale/tinyauth management + first-run password setup,
        # see router/frontend/src/App.tsx and static.go) - lets router be
        # administered without webmanager. tailscale/dev-proxy admin CRUD
        # used to be proxied in by code-docker's nginx as three separate
        # locations - now unified since both sides of this proxy hop are
        # router's own nginx and router-manager, no need to remap prefixes.
        # Unlike /exports/ above, code-docker's own nginx is a legitimate
        # caller here (webmanager's Tailscale/Dev Proxy tabs proxy through
        # it), so no internal-source deny. No cookie stripping either - this
        # *is* the legitimate destination for router_manager_unlock.
        #
        # Reachable here on the shared hostname for convenience (embedded
        # webmanager tabs use it with zero extra setup), but that means the
        # unlock cookie set from here is scoped to the same origin as
        # code-server/webmanager/every exposed app - a compromise anywhere
        # on that shared origin (XSS, a poisoned agent writing to the page,
        # etc.) can ride this cookie via a same-origin fetch(), same-origin
        # script isn't stopped by HttpOnly/SameSite=Strict. Set
        # ROUTER_MANAGER_HOSTS (below) and use that dedicated domain instead
        # for anything security-sensitive - see docs/router.md.
        location /router/ {
            proxy_pass http://unix:/run/router-manager.sock:/;
            proxy_set_header Host $host;
            # The VNC tab's RFB bridge (/router/api/vnc/targets/<name>/ws)
            # is a WebSocket, and it's the only one under this prefix - but
            # without these three lines nginx strips the upgrade and
            # router-manager answers 426 Upgrade Required, which surfaces as
            # a viewer that loads and then never connects.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # App Routes - path-based, Host-header-agnostic reverse proxy
        # (docs/app-routes.md). router's own Caddy (caddy-adapter) does all
        # per-app matching/stripping via /app/<name>/* handle_path blocks
        # (see caddy-adapter.default.sh's third site block); this location
        # is permanently static and never needs editing again regardless of
        # how many apps get added/removed/reconfigured via the API - no
        # rewrite here (unlike /exports/ above), the full original request
        # URI passes through unchanged (proxy_pass with no URI part after
        # the socket). No internal-source deny (unlike /exports/) - the
        # expected caller is an external/outer reverse proxy prepending
        # /app/<name> to its own incoming requests, same trust level as the
        # / catch-all below, not an internal-only concern. App targets are
        # just as untrusted as /exports/ targets (user-registered, possibly
        # third-party apps) - see the cookie-strip map's comment above, same
        # reasoning applies here.
        location /app/ {
            proxy_pass http://unix:/run/caddy-app.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # Same as /exports/ above - tinyauth's forward_auth reads this.
            proxy_set_header X-Forwarded-Proto $router_forwarded_proto;
            proxy_set_header Cookie $router_manager_cookie_stripped;
        }

        # Everything else - code-server (/) and webmanager (/manager/) both
        # still live entirely on code-docker's own nginx, unchanged. This is
        # code-docker's whole nginx (port 80), NOT code-server's own bind
        # address - don't confuse with the main image's own
        # NGINX_CODE_SERVER_UPSTREAM (a different variable, different
        # meaning, used inside code-docker's nginx.default.conf). Proxied to
        # caddy-adapter's own DEFAULT_UPSTREAM-backed site block (see
        # caddy-adapter.default.sh) rather than a hardcoded upstream here -
        # this nginx config doesn't need to know or care what's actually
        # behind it, same reasoning /exports/ and /app/ already follow.
        location / {
            proxy_pass http://unix:/run/caddy-default.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
